services:
  nuxt:
    build: .
    container_name: snaptix_app
    restart: unless-stopped
    networks:
      - snaptix_net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID}
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: snaptix_mongo
    restart: unless-stopped
    networks:
      - snaptix_net
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: snaptix
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ./mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet
        -u "$$MONGO_INITDB_ROOT_USERNAME"
        -p "$$MONGO_INITDB_ROOT_PASSWORD"
        --authenticationDatabase admin
        --eval "db.adminCommand('ping').ok"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:8
    container_name: snaptix_redis
    restart: unless-stopped
    networks:
      - snaptix_net
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  logs:
  mongo_data:
  redis_data:

networks:
  snaptix_net:
    driver: bridge